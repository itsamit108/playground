[project]
name = "fastapi-cloud-demo"
version = "0.1.0"
description = "FastAPI Cloud demo app with a continuously running in-memory counter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "psutil>=7.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Point ty (and other tools) at this project's virtualenv so imports resolve
# correctly even when the type checker is launched from a parent workspace.
[tool.ty.environment]
python = ".venv"
python-version = "3.13"

[tool.ty.src]
exclude = [".venv"]
