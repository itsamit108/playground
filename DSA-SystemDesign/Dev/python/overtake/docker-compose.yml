version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: overtake-localstack
    ports:
      - "4566:4566"       # LocalStack gateway
      - "4510-4559:4510-4559"  # External service port range (RDS etc.)
    environment:
      - SERVICES=s3,rds
      - DEBUG=1
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack_data:
