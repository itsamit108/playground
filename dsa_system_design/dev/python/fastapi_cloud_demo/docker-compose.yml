services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Offline-first defaults; the app needs no external services to run.
      LLM_PROVIDER: ${LLM_PROVIDER:-echo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # Optional extension point: a local Ollama for the "ollama" LLM provider.
  # Uncomment and set LLM_PROVIDER=ollama + OLLAMA_BASE_URL=http://ollama:11434
  # ollama:
  #   image: ollama/ollama:latest
  #   ports: ["11434:11434"]
  #   volumes: ["ollama_data:/root/.ollama"]
# volumes:
#   ollama_data:
