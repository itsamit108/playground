services:
  localstack:
    image: localstack/localstack:latest
    container_name: overtake-localstack
    ports:
      - "4566:4566"       # LocalStack gateway
      - "4510-4559:4510-4559"  # External service port range (RDS etc.)
    environment:
      - SERVICES=s3,rds
      - DEBUG=1
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  api:
    build: .
    container_name: overtake-api
    depends_on:
      - localstack
    ports:
      - "8000:8000"
    environment:
      # Talk to LocalStack over the compose network (service name = hostname).
      # NOTE: provision RDS + S3 first with `make infra-up` (Terraform); the api
      # container retries via restart until the database is reachable.
      - DATABASE_URL=postgresql://overtake:overtake123@localstack:4510/overtake_db
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET_NAME=overtake-media
      - LLM_PROVIDER=${LLM_PROVIDER:-echo}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-change-me-in-production}
    restart: unless-stopped

volumes:
  localstack_data:
