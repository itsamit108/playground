[project]
name = "deep-dive"
version = "2.0.0"
description = "PDF to EPUB3 GenAI app on the 2026 FastAPI Agentic AI architecture."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ebooklib>=0.18",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "llama-cloud>=0.1.0",
    "lxml>=5.0",
    "pillow>=10.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
