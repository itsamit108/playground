[project]
name = "bedrock-chatbot"
version = "0.1.0"
description = "CLI chatbot powered by LocalStack Bedrock (Converse API) and Ollama"
authors = [{ name = "Amit" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.35.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "rich>=13.9.0,<14.0.0",
]

[project.scripts]
chatbot = "chatbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatbot"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
