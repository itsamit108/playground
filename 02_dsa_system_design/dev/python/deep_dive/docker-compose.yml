services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Offline-first defaults; override in .env to enable real providers.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    volumes:
      - ./generated:/app/generated
    restart: unless-stopped

  # Example extension points (commented out — the app needs none of these to run):
  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports: ["6333:6333"]
