[project]
name = "overtake"
version = "0.1.0"
description = "Multi-user multimedia note-taking API powered by FastAPI, SQLModel, and AWS (LocalStack)"
authors = [{ name = "Amit" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "sqlmodel>=0.0.22,<0.0.23",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.18,<0.0.19",
    "boto3>=1.35.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<0.29.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<0.9.0",
]

[tool.uv]
package = false

# Point ty (and other tools) at this project's virtualenv so imports resolve
# correctly even when the type checker is launched from a parent workspace.
[tool.ty.environment]
python = ".venv"
python-version = "3.12"

[tool.ty.src]
exclude = [".venv", "terraform"]
